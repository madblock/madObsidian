[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madobsidian"
version = "0.2.1"
description = "A personal media archive and Obsidian integration project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0"]

[project.scripts]
madObsidian = "madobsidian.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
madobsidian = ["assets/*.ttf", "assets/*.txt"]
