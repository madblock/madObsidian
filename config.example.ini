[general]
# Used when .obsidian/app.json omits attachmentFolderPath.
# Failure exclusions are stored in madobsidian_exclusions.ini at the vault root.
incoming_directory = Incoming
objects_directory = objects
small_file_threshold_bytes = 256000
# Allow imports past conflict copies outside managed data. Transfer checks still apply.
allow_unrelated_syncthing_conflicts = false

[images]
max_dimension = 960
format = webp
quality = 85
method = 6

[videos]
max_dimension = 400
format = mp4
video_codec = libx264
video_crf = 25
preset = medium
audio_codec = aac

[watermark]
enabled = true
font = bundled
# auto retains the existing media-specific font size, opacity, and margin behavior.
font_size = auto
opacity = auto
position = bottom-left
margin = auto

[tools]
ffmpeg = auto
ffprobe = auto
